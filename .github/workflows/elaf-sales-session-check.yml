name: ELAF Sales — safe scheduled session check

on:
  schedule:
    - cron: '29 9,15 * * 1-6'
      timezone: Africa/Cairo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elaf-sales-session-check
  cancel-in-progress: false

jobs:
  verify-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELAF_SESSIONS_DATABASE_URL: ${{ secrets.ELAF_SESSIONS_DATABASE_URL }}
      ELAF_SESSION_ENCRYPTION_KEY: ${{ secrets.ELAF_SESSION_ENCRYPTION_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install audit dependencies only when authorized session is configured
        if: ${{ env.ELAF_SESSIONS_DATABASE_URL != '' && env.ELAF_SESSION_ENCRYPTION_KEY != '' }}
        working-directory: sales-automation-cloud
        run: |
          npm install --omit=dev --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Check Engaz session without exporting client data
        run: node sales-automation-cloud/scheduled-review.mjs

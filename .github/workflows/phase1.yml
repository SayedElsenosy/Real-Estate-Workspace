name: BUNYRA CI — Phases 1-16
on:
  push:
    branches: [main]
  pull_request:
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: foundation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d foundation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:5432/foundation_test
      TEST_DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:5432/foundation_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/foundation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Export npm lockfile for review
        run: |
          echo BEGIN_PACKAGE_LOCK_BASE64
          base64 -w 120 package-lock.json
          echo END_PACKAGE_LOCK_BASE64
      - run: npm run db:migrate
      - run: node scripts/test-secure-receipts.mjs
      - run: node scripts/test-auth-rls.mjs
      - run: node scripts/test-phase15-platform-invitations.mjs
      - run: node scripts/test-phase16-audit.mjs
      - run: npm run test:rls
      - run: npm run test:inventory-rls
      - run: npm run test:booking-concurrency
      - run: node --import tsx scripts/test-business-date.mjs
      - run: npm run test:installments-math
      - run: npm run test:contracts-transaction
      - run: npm run test:payments-concurrency
      - run: npm run typecheck
      - run: npm run build

  frontend-e2e:
    name: Chromium E2E — Inventory, Bookings, Finance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: foundation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d foundation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:5432/foundation_test
      DATABASE_URL: postgresql://workspace_demo_runtime:demo_only_very_long_password_2026@127.0.0.1:5432/foundation_test
      DEMO_RUNTIME_PASSWORD: demo_only_very_long_password_2026
      DEMO_SEED_ALLOW: I_ACKNOWLEDGE_DEMO_ONLY
      AUTH_SECRET: ci_only_auth_secret_at_least_64_characters_never_use_in_production
      AUTH_URL: http://127.0.0.1:3000
      AUTH_DATABASE_URL: postgresql://workspace_auth_runtime:ci_auth_only_long_password_2026@127.0.0.1:5432/foundation_test
      AUTH_RUNTIME_PASSWORD: ci_auth_only_long_password_2026
      DEMO_ACCOUNT_PASSWORD: CI-demo-accounts-only-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run db:migrate
      - run: node scripts/create-demo-runtime.mjs
      - run: npm run auth:create-runtime
      - run: npm run db:seed-demo
      - name: Verify first administrator provisioning
        run: npm run auth:create-admin
        env:
          ADMIN_TENANT_ID: a1111111-1111-4111-8111-111111111111
          ADMIN_EMAIL: provisioned-admin@demo-horizon.example.invalid
          ADMIN_NAME: CI Provisioned Admin
          ADMIN_PASSWORD: CI-provisioning-only-2026!
      - run: npx playwright install --with-deps chromium
      - name: Launch local Next.js
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/workspace-next.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/workspace-next.log
          exit 1
      - run: npm run test:e2e
      - name: Replay migrations after bounced-cheque settlement E2E
        run: npm run db:migrate
      - name: Verify real receipt and cheque-event immutability
        run: node scripts/test-append-only-records.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ui-preview-screenshots
          path: test-results/*.png
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: |
            test-results/
            playwright-report/
